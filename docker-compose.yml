services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: apex
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U apex"], interval: 5s, retries: 10 }
  analytics:
    build: ./analytics
    environment:
      ANALYTICS_SERVICE_TOKEN: ${ANALYTICS_SERVICE_TOKEN:?set in .env}
  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
      analytics: { condition: service_started }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://apex:${POSTGRES_PASSWORD}@db:5432/apex
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      ANALYTICS_URL: http://analytics:8000
      ANALYTICS_SERVICE_TOKEN: ${ANALYTICS_SERVICE_TOKEN}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    ports: ["4000:4000"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8080:80"]
volumes:
  dbdata:
